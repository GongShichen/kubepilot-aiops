openapi: 3.0.3
info:
  title: KubePilot Causal-Aware Autonomous SRE Agent API
  version: 0.4.0
servers: [{url: "http://localhost:8080"}]
security: [{bearerAuth: []}]
paths:
  /healthz:
    get: {security: [], responses: {'200': {description: Healthy}}}
  /readyz:
    get: {security: [], responses: {'200': {description: Postgres, Redis, and Agent Registry ready}, '503': {description: A required component is unavailable}}}
  /metrics:
    get: {security: [], responses: {'200': {description: Prometheus metrics}}}
  /api/v1/alerts/alertmanager:
    post:
      summary: Receive Alertmanager webhook
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AlertmanagerWebhook'}}}}
      responses: {'202': {description: Accepted}, '401': {description: Unauthorized}}
  /api/v1/incidents:
    get:
      summary: List incidents
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses: {'200': {description: Incident list}}
    post:
      summary: Create a manual incident
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualIncident'}}}}
      responses: {'200': {description: Incident, content: {application/json: {schema: {$ref: '#/components/schemas/Incident'}}}}}
  /api/v1/incidents/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/IncidentID'}]
      responses: {'200': {description: Incident}, '404': {description: Not found}}
  /api/v1/incidents/{id}/alerts:
    get: {parameters: [{$ref: '#/components/parameters/IncidentID'}], responses: {'200': {description: Alerts}}}
  /api/v1/incidents/{id}/evidence:
    get: {parameters: [{$ref: '#/components/parameters/IncidentID'}], responses: {'200': {description: Evidence, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Evidence'}}}}}}}
  /api/v1/incidents/{id}/hypotheses:
    get:
      summary: Read the auditable hypothesis lifecycle and confidence history
      parameters: [{$ref: '#/components/parameters/IncidentID'}]
      responses: {'200': {description: Hypothesis ledger}, '404': {description: Incident not found}}
  /api/v1/incidents/{id}/agent-runs:
    get:
      summary: Read strategy identity, parent-child Agent usage, decisions, and Safety feedback
      parameters: [{$ref: '#/components/parameters/IncidentID'}]
      responses: {'200': {description: Agent run ledger, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunLedger'}}}}, '404': {description: Incident not found}}
  /api/v1/incidents/{id}/investigation:
    get:
      summary: Read the complete auditable runtime state without hidden chain-of-thought
      parameters: [{$ref: '#/components/parameters/IncidentID'}]
      responses: {'200': {description: Investigation without hidden reasoning, content: {application/json: {schema: {$ref: '#/components/schemas/Investigation'}}}}, '404': {description: Incident not found}}
  /api/v1/incidents/{id}/events:
    get: {parameters: [{$ref: '#/components/parameters/IncidentID'}], responses: {'200': {description: Audit events}}}
  /api/v1/incidents/{id}/stream:
    get: {parameters: [{$ref: '#/components/parameters/IncidentID'}], responses: {'200': {description: Eino workflow server-sent events, content: {text/event-stream: {schema: {type: string}}}}}}
  /api/v1/incidents/{id}/approval:
    post:
      parameters:
        - {$ref: '#/components/parameters/IncidentID'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
      responses: {'200': {description: Updated incident}, '409': {description: Invalid state}}
  /api/v1/incidents/{id}/retry:
    post: {parameters: [{$ref: '#/components/parameters/IncidentID'}], responses: {'200': {description: Diagnosis restarted as a new Workflow Attempt}, '409': {description: Invalid state}}}
  /api/v1/incidents/{id}/workflow-attempts/migrate:
    post:
      summary: Explicitly invalidate frozen artifacts and start a new Workflow Attempt
      parameters: [{$ref: '#/components/parameters/IncidentID'}]
      responses: {'200': {description: New Workflow Attempt created}, '409': {description: Incident is not eligible for migration}}
  /api/v1/model/health:
    get: {responses: {'200': {description: Redacted model configuration status}}}
  /api/v1/model/probe:
    post: {responses: {'200': {description: Model probe passed}, '502': {description: Probe failed}}}
  /api/v1/reranker/health:
    get: {responses: {'200': {description: Redacted reranker configuration status}, '503': {description: Reranker unavailable}}}
  /api/v1/reranker/probe:
    post: {responses: {'200': {description: Reranker probe passed}, '502': {description: Probe failed}, '503': {description: Reranker unavailable}}}
  /api/v1/runtime/readiness:
    get: {responses: {'200': {description: Runtime and model components ready}, '503': {description: One or more benchmark prerequisites are unavailable}}}
  /api/v1/knowledge/causal-patterns:
    get:
      summary: List causal patterns
      parameters: [{name: status, in: query, schema: {type: string, enum: [candidate, validating, active, rejected, disabled]}}]
      responses: {'200': {description: Causal patterns, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CausalPattern'}}}}}}
  /api/v1/knowledge/causal-patterns/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Causal pattern, content: {application/json: {schema: {$ref: '#/components/schemas/CausalPattern'}}}}, '404': {description: Not found}}
  /api/v1/knowledge/causal-patterns/{id}/status:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [validating, active, rejected, disabled]}}}}}}
      responses: {'200': {description: Updated causal pattern}, '400': {description: Invalid status}}
  /api/v1/knowledge/causal-patterns/{id}/rollback:
    post:
      summary: Restore a recorded causal pattern revision while keeping monotonic audit history
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: X-Operator, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Restored causal pattern}, '400': {description: Invalid revision or missing operator}, '404': {description: Revision not found}}
  /api/v1/benchmarks/runs:
    get: {responses: {'200': {description: Benchmark runs}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: {type: string, enum: [smoke, ci, standard, robustness, correlation, log-retrieval, incident-retrieval, full]}
                strategies: {type: array, items: {type: string, enum: [direct, rag, react, rule-only, evidence-only, cognitive, active-diagnosis, kubepilot, kubepilot-no-reflection, kubepilot-no-optional-skills]}, default: [direct, rag, react, rule-only, evidence-only, cognitive, active-diagnosis, kubepilot, kubepilot-no-reflection, kubepilot-no-optional-skills]}
                dataset_split: {type: string, enum: [dev, validation, test, all], default: test}
                seeds: {type: array, minItems: 1, items: {type: integer, format: int64}, default: [20260803, 20260804, 20260805]}
                repetitions: {type: integer, minimum: 1, default: 1}
                model_profile: {type: string}
                auto_approve: {type: boolean}
      responses: {'200': {description: Benchmark run created}}
  /api/v1/benchmarks/runs/{id}:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Benchmark run}}}
  /api/v1/benchmarks/runs/{id}/stream:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Benchmark SSE}}}
  /api/v1/benchmarks/runs/{id}/cancel:
    post: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Cancellation requested}}}
  /api/v1/benchmarks/runs/{id}/resume:
    post: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Run resumed from persisted case checkpoints}, '409': {description: Run is not resumable}}}
  /api/v1/benchmarks/runs/{id}/results:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Machine-readable results}}}
  /api/v1/benchmarks/runs/{id}/artifacts:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Artifact manifest}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IncidentID: {name: id, in: path, required: true, schema: {type: string}}
  schemas:
    ManualIncident:
      type: object
      required: [service, namespace, summary]
      properties:
        severity: {type: string}
        service: {type: string}
        cluster: {type: string, description: Stable cluster scope used for memory isolation}
        namespace: {type: string}
        resource: {type: string}
        summary: {type: string}
        diagnosis_method: {type: string, enum: [direct, rag, react, rule-only, evidence-only, cognitive, active-diagnosis, kubepilot, kubepilot-no-reflection, kubepilot-no-optional-skills], default: kubepilot}
        causal_mode: {type: string, enum: [no-causal, static-causal, learned-causal, full], default: full, description: Runtime causal knowledge policy used for controlled ablations and deployments}
        evidence_start_at: {type: string, format: date-time, description: Optional start of the incident observation window}
    Approval:
      type: object
      required: [proposal_id, decision]
      properties:
        proposal_id: {type: string}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string}
    Incident:
      type: object
      required: [id, status, service, namespace, created_at]
      properties:
        id: {type: string}
        status: {type: string, enum: [RECEIVED, CORRELATING, COLLECTING, DIAGNOSING, PROPOSING, AWAITING_APPROVAL, RECOVERING, VERIFYING, RESOLVED, NEEDS_ATTENTION, REJECTED, RECOVERY_FAILED, CANCELLED]}
        severity: {type: string}
        service: {type: string}
        cluster: {type: string}
        namespace: {type: string}
        resource: {type: string}
        summary: {type: string}
        diagnosis_method: {type: string, enum: [direct, rag, react, rule-only, evidence-only, cognitive, active-diagnosis, kubepilot, kubepilot-no-reflection, kubepilot-no-optional-skills]}
        causal_mode: {type: string, enum: [no-causal, static-causal, learned-causal, full]}
        diagnosis_error: {type: string, description: Workflow failure kept separate from an incorrect diagnosis}
        recovery_execution:
          type: object
          description: Server-owned deterministic mutation audit; unknown outcomes are not counted as confirmed mutations
          properties:
            attempts: {type: integer}
            confirmed_mutations: {type: integer}
            namespace: {type: string}
            target: {type: string}
            action: {type: string}
            outcome: {type: string, enum: [attempting, succeeded, failed, unknown]}
            last_attempt_at: {type: string, format: date-time}
            completed_at: {type: string, format: date-time}
        evidence_start_at: {type: string, format: date-time}
        root_cause: {type: string}
        root_cause_category: {type: string, description: Open-world LLM diagnosis category; baseline strategies continue to emit their fixed categories}
        root_cause_variant: {type: string, description: Operational failure variant selected by the Diagnosis Agent}
        root_cause_service: {type: string, description: Service selected by the diagnosis agent as the root-cause location}
        root_cause_resource: {type: string, description: Kubernetes workload selected by the diagnosis agent as the root-cause resource}
        root_cause_evidence_ids: {type: array, items: {type: string}}
        confidence: {type: number}
        reasoning_type: {type: string, enum: [hypothesis_verification]}
        execution_snapshot: {$ref: '#/components/schemas/ExecutionSnapshot'}
        workflow_attempt: {$ref: '#/components/schemas/WorkflowAttempt'}
        dry_run: {$ref: '#/components/schemas/DryRunResult'}
        investigation: {$ref: '#/components/schemas/Investigation'}
        created_at: {type: string, format: date-time}
    Evidence:
      type: object
      required: [id, source, timestamp, namespace, service, resource, summary, confidence]
      properties:
        id: {type: string}
        source: {type: string, enum: [prometheus, loki, jaeger, kubernetes, historical]}
        type: {type: string}
        timestamp: {type: string, format: date-time}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        namespace: {type: string}
        service: {type: string}
        resource: {type: string}
        summary: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        neural_score: {type: number, minimum: 0, maximum: 1}
        neural_ranked: {type: boolean}
        attribution: {$ref: '#/components/schemas/EvidenceAttribution'}
        trace_id: {type: string}
        template_id: {type: string}
        content: {type: object, additionalProperties: true, description: Untrusted external evidence payload}
        facts: {type: object, additionalProperties: true, description: Canonical server-normalized facts shared by workers, diagnosis, and critic components}
        truncated_fields: {type: array, items: {type: string}}
        signals: {type: array, items: {$ref: '#/components/schemas/EvidenceSignal'}}
        quality_score: {type: number, minimum: 0, maximum: 1}
        relevance_score: {type: number, minimum: 0, maximum: 1}
        ranking_reasons: {type: array, items: {type: string}}
        causal_node_ids: {type: array, items: {type: string}}
    EvidenceAttribution:
      type: object
      properties:
        temporal_alignment: {type: number, minimum: 0, maximum: 1}
        service_resource_match: {type: number, minimum: 0, maximum: 1}
        trace_request_pod_match: {type: number, minimum: 0, maximum: 1}
        causal_contribution: {type: number, minimum: 0, maximum: 1}
        anomaly_specificity: {type: number, minimum: 0, maximum: 1}
        attribution_score: {type: number, minimum: 0, maximum: 1}
        reasons: {type: array, items: {type: string}}
    SafetyFeedback:
      type: object
      required: [allowed, scope, code, reason, retryable, requires_human, remaining_corrections]
      properties:
        allowed: {type: boolean}
        scope: {type: string, enum: [supervisor, diagnosis, recovery_proposal, execution, verification]}
        category: {type: string, enum: [repairable, fatal, human_required]}
        code: {type: string}
        reason: {type: string}
        failed_checks: {type: array, items: {type: object}}
        missing_requirements: {type: array, items: {type: string}}
        required_capabilities: {type: array, items: {type: string}, description: Capability gaps only; never a concrete tool or answer}
        retryable: {type: boolean}
        requires_human: {type: boolean}
        remaining_corrections: {type: integer, minimum: 0}
    AgentDecisionEvent:
      type: object
      required: [agent_id, iteration, observation_summary, selected_action, reason_category, occurred_at]
      properties:
        agent_id: {type: string}
        iteration: {type: integer, minimum: 1}
        observation_summary: {type: string, description: Structured observation summary; hidden model reasoning is never stored}
        selected_action: {type: string}
        reason_category: {type: string}
        occurred_at: {type: string, format: date-time}
    CausalPattern:
      type: object
      required: [id, category, cause, nodes, edges, source, confidence, status, version]
      properties:
        id: {type: string}
        category: {type: string, enum: [cpu, memory, database, network, deployment, dependency]}
        cause: {type: string}
        nodes: {type: array, items: {type: object}}
        edges: {type: array, items: {type: object}}
        supporting_evidence: {type: array, items: {type: object}}
        contradicting_evidence: {type: array, items: {type: object}}
        source_incidents: {type: array, items: {type: string}}
        cluster: {type: string}
        namespace: {type: string}
        source: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        status: {type: string, enum: [candidate, validating, active, rejected, disabled]}
        version: {type: integer}
        support_count: {type: integer}
    Investigation:
      type: object
      required: [architecture, plan, started_at]
      properties:
        architecture: {type: string, enum: [single-pass, single-pass-episodic, single-react, eino-rule-diagnosis-runtime, eino-evidence-diagnosis-runtime, eino-cognitive-diagnosis-runtime, eino-native-self-reflective-brain]}
        plan: {$ref: '#/components/schemas/InvestigationPlan'}
        findings: {type: array, items: {$ref: '#/components/schemas/WorkerFinding'}}
        debate: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/DebateRound'}}
        candidates: {type: array, items: {type: object, description: Server-generated candidate draft with referenced evidence and graph node IDs}}
        verified_hypotheses: {type: array, items: {type: object, description: Deterministic evidence, causal, observation, contradiction, and objective-score audit}}
        signals: {type: array, items: {$ref: '#/components/schemas/EvidenceSignal'}}
        state_assertions: {type: array, items: {$ref: '#/components/schemas/StateAssertion'}}
        cognitive_reasoning: {type: array, items: {$ref: '#/components/schemas/CognitiveReasoning'}}
        falsification: {type: array, items: {$ref: '#/components/schemas/FalsificationResult'}}
        pairwise_falsification: {type: array, items: {$ref: '#/components/schemas/PairwiseFalsification'}}
        candidate_expansion_requests: {type: array, items: {$ref: '#/components/schemas/CandidateExpansionRequest'}}
        arbitration: {$ref: '#/components/schemas/ArbitrationResult'}
        recovery_permission: {$ref: '#/components/schemas/RecoveryPermission'}
        memory_reads: {type: array, items: {$ref: '#/components/schemas/MemoryAccessEvent'}}
        model_usage: {type: array, items: {$ref: '#/components/schemas/ModelUsageEvent'}}
        brain_turns: {type: array, items: {$ref: '#/components/schemas/BrainTurn'}}
        assistant_turns: {type: array, items: {$ref: '#/components/schemas/AssistantTurnRecord'}}
        incident_understanding: {$ref: '#/components/schemas/IncidentUnderstanding'}
        skill_activations: {type: array, items: {$ref: '#/components/schemas/SkillActivation'}}
        tool_executions: {type: array, items: {$ref: '#/components/schemas/BrainToolExecution'}}
        agent_hypotheses: {type: array, items: {$ref: '#/components/schemas/AgentHypothesis'}}
        hypothesis_admissions: {type: array, items: {$ref: '#/components/schemas/HypothesisAdmission'}}
        hypothesis_groundings: {type: array, items: {$ref: '#/components/schemas/HypothesisGrounding'}}
        hypothesis_comparisons: {type: array, items: {$ref: '#/components/schemas/HypothesisComparison'}}
        grounding_deltas: {type: array, items: {$ref: '#/components/schemas/GroundingDelta'}}
        belief_deltas: {type: array, items: {$ref: '#/components/schemas/BeliefDelta'}}
        reflections: {type: array, items: {$ref: '#/components/schemas/ReflectionRecord'}}
        agent_diagnosis: {$ref: '#/components/schemas/AgentDiagnosis'}
        diagnosis_validations: {type: array, items: {$ref: '#/components/schemas/DiagnosisValidation'}}
        agent_recovery_plan: {$ref: '#/components/schemas/AgentRecoveryPlan'}
        termination: {$ref: '#/components/schemas/TerminationEvent'}
        brain_budget: {$ref: '#/components/schemas/BrainBudgetState'}
        execution_snapshot: {$ref: '#/components/schemas/ExecutionSnapshot'}
        workflow_attempt: {$ref: '#/components/schemas/WorkflowAttempt'}
        diagnosis_rounds: {type: integer, minimum: 1, maximum: 2}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    ExecutionSnapshot:
      type: object
      required: [skill_snapshot_hash, model_config_hash, tool_schema_hash, policy_hash]
      properties:
        skill_snapshot_hash: {type: string}
        model_config_hash: {type: string}
        tool_schema_hash: {type: string}
        policy_hash: {type: string}
    WorkflowAttempt:
      type: object
      required: [id, incident_id, sequence, checkpoint_id, status, execution_snapshot, started_at]
      properties:
        id: {type: string}
        incident_id: {type: string}
        sequence: {type: integer, minimum: 1}
        checkpoint_id: {type: string}
        status: {type: string, enum: [ACTIVE, INTERRUPTED, COMPLETED, INVALIDATED]}
        execution_snapshot: {$ref: '#/components/schemas/ExecutionSnapshot'}
        evidence_snapshot_hash: {type: string}
        migrated_from_attempt_id: {type: string}
        invalidated_artifact_ids: {type: array, items: {type: string}}
        started_at: {type: string, format: date-time}
        interrupted_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    SkillActivation:
      type: object
      required: [skill_id, version, content_hash, phase, reason, trigger, requested_by, status, activated_at]
      properties:
        skill_id: {type: string}
        version: {type: string}
        content_hash: {type: string}
        phase: {type: string}
        reason: {type: string}
        trigger: {type: string}
        requested_by: {type: string, enum: [BRAIN, RUNTIME]}
        requested_turn: {type: string}
        status: {type: string, enum: [ACTIVATED, REJECTED]}
        rejected_reason: {type: string}
        activated_at: {type: string, format: date-time}
    ToolResultProvenance:
      type: object
      required: [tool_call_id, tool_name, tool_schema_hash, collector, target_refs, window_start, window_end, observed_at, raw_artifact_hash, parser_version, evidence_ids]
      properties:
        tool_call_id: {type: string}
        tool_name: {type: string}
        tool_schema_hash: {type: string}
        collector: {type: string}
        target_refs: {type: array, items: {$ref: '#/components/schemas/ResourceRef'}}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        raw_artifact_hash: {type: string}
        parser_version: {type: string}
        evidence_ids: {type: array, items: {type: string}}
        state_change_id: {type: string}
        approval_id: {type: string}
        mutation_spec_hash: {type: string}
        target_uid: {type: string}
        resource_version: {type: string}
    ToolResultRecord:
      type: object
      required: [class, provenance, status, new_information, occurred_at]
      properties:
        class: {type: string, enum: [EVIDENCE, VALIDATION, CONSTRAINT, ERROR, STATE_CHANGE]}
        provenance: {$ref: '#/components/schemas/ToolResultProvenance'}
        status: {type: string}
        summary: {type: string}
        validation_ids: {type: array, items: {type: string}}
        new_information: {type: boolean}
        constraint_code: {type: string}
        infrastructure_failure: {type: boolean}
        occurred_at: {type: string, format: date-time}
    BrainToolExecution:
      type: object
      required: [envelope, result]
      properties:
        envelope: {$ref: '#/components/schemas/AgentActionEnvelope'}
        result: {$ref: '#/components/schemas/ToolResultRecord'}
    AgentActionIntent:
      type: object
      required: [intent]
      properties:
        intent: {type: string}
        target_scope: {type: array, items: {$ref: '#/components/schemas/ResourceRef'}}
        hypothesis_ids: {type: array, items: {type: string}}
        evidence_need: {type: array, items: {type: string}}
        expected_observation: {type: array, items: {type: string}}
    AgentActionEnvelope:
      type: object
      required: [action_id, incident_id, turn_id, phase, tool_name, tool_category, evidence_snapshot_hash, idempotency_key, intent]
      properties:
        action_id: {type: string}
        incident_id: {type: string}
        turn_id: {type: string}
        phase: {type: string, enum: [INTAKE, PLANNING, INVESTIGATION, REFLECTION, DIAGNOSIS, RECOVERY, VERIFICATION, ESCALATION]}
        tool_name: {type: string}
        tool_category: {type: string, enum: [EVIDENCE, RETRIEVAL, REASONING, RECOVERY, CONTROL]}
        skill_refs: {type: array, items: {$ref: '#/components/schemas/SkillRef'}}
        evidence_snapshot_hash: {type: string}
        idempotency_key: {type: string}
        intent: {$ref: '#/components/schemas/AgentActionIntent'}
    SkillRef:
      type: object
      required: [id, version, content_hash]
      properties:
        id: {type: string}
        version: {type: string}
        content_hash: {type: string}
    BrainTurn:
      type: object
      required: [id, sequence, phase, started_at]
      description: Structured Eino Brain turn audit; hidden chain-of-thought is never persisted.
      properties:
        id: {type: string}
        sequence: {type: integer, minimum: 1}
