# KubePilot reproducibility and evaluation contract.
# Runtime values such as code_commit, model names and hashes are resolved into
# artifacts/<run-id>/manifest.json at benchmark start. This file is hashed and
# recorded so a run cannot be resumed after the benchmark contract changes.
version: autonomous-sre
dataset_version: incident-dataset
code_commit: "${GIT_COMMIT}"
model:
  protocol: "${CHAT_PROTOCOL}"
  name: "${CHAT_MODEL}"
  config_hash: "${MODEL_CONFIG_HASH}"
embedding_model: "${EMBEDDING_MODEL}"
reranker:
  protocol: "${RERANKER_PROTOCOL}"
  name: "${RERANKER_MODEL}"
  config_hash: "${RERANKER_CONFIG_HASH}"
skill_hash: "${SKILL_SNAPSHOT_HASH}"
budget_config:
  # max_tokens is per Agent response; input and cumulative tokens are telemetry.
  supervisor_agent:
    max_iterations: 10
    max_tool_uses: 50
    max_tokens: 8192
    max_corrections: 3
  planner_agent: &diagnosis_agent_budget
    max_iterations: 18
    max_tool_uses: 50
    max_tokens: 8192
    max_corrections: 3
  metric_worker: *diagnosis_agent_budget
  log_worker: *diagnosis_agent_budget
  trace_worker: *diagnosis_agent_budget
  topology_worker: *diagnosis_agent_budget
  diagnosis_agent: *diagnosis_agent_budget
  alternative_agent: *diagnosis_agent_budget
  critic_agent: *diagnosis_agent_budget
  recovery_agent:
    max_iterations: 10
    max_tool_uses: 50
    max_tokens: 8192
    max_corrections: 2
retrieval_config:
  semantic_top_k: 50
  lexical_top_k: 50
  topology_rerank_top_k: 20
  causal_rerank_top_k: 20
  final_top_k: 5
  neural_reranker: true
ranking_weights:
  evidence:
    deterministic: 0.70
    neural: 0.30
  incident:
    deterministic: 0.45
    neural: 0.55
evaluation:
  strategies: [rule-only, evidence-only, cognitive, active-diagnosis, react]
  causal_modes: [no-causal, static-causal, learned-causal, full]
  split: test
  seeds: [20260803, 20260804, 20260805]
  repetitions: 1
  parallelism: 4
  model_concurrency: 4
  shard_policy: case-seed-repetition-hash
  worker_namespaces:
    - kubepilot-benchmark-worker-01
    - kubepilot-benchmark-worker-02
    - kubepilot-benchmark-worker-03
    - kubepilot-benchmark-worker-04
  infrastructure_failure_limit: 0.02
datasets:
  diagnosis:
    path: benchmark/incidents.yaml
    size: 120
    category_counts: {cpu: 20, memory: 20, database: 20, network: 20, deployment: 20, dependency: 20}
    ground_truth: evaluator_only
  log_retrieval:
    path: benchmark/datasets/logs.yaml
    size: 500000
    ground_truth: template_ids
  incident_retrieval:
    path: benchmark/datasets/incidents/structured.yaml
    size: 500
    category_counts: {memory: 100, database: 100, network: 100, deployment: 100, cpu: 100}
    ground_truth: related_incidents
