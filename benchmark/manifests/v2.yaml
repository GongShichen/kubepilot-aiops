# Reproducibility contract for the isolated Autonomous Incident benchmark.
# Runtime values are resolved into an artifact manifest; no secret is stored.
version: autonomous-incident-v2
code_commit: "${GIT_COMMIT}"
model:
  protocol: "${CHAT_PROTOCOL}"
  name: "${CHAT_MODEL}"
  config_hash: "${MODEL_CONFIG_HASH}"
embedding_model: "${EMBEDDING_MODEL}"
reranker:
  protocol: "${RERANKER_PROTOCOL}"
  name: "${RERANKER_MODEL}"
  config_hash: "${RERANKER_CONFIG_HASH}"
skill_hash: "${SKILL_SNAPSHOT_HASH}"
retrieval_config:
  semantic_top_k: 50
  lexical_top_k: 50
  topology_top_k: 50
  rrf_k: 60
  rerank_top_k: 5
budget_config:
  supervisor_max_iterations: 10
  diagnosis_max_iterations: 12
  recovery_max_iterations: 10
  incident_max_tool_uses: 30
dataset_version: incident-dataset-v2
