apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata: {labels: {app: payment-service, service: payment-service}}
    spec:
      containers:
        - name: payment
          image: kubepilot/demo-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE_NAME, value: payment-service}
            - {name: K8S_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: BENCHMARK_CONTROL_TOKEN, valueFrom: {secretKeyRef: {name: demo-secrets, key: benchmark-control-token}}}
            - {name: DB_ADDR, value: "mysql:3306"}
            - {name: DB_NAME, value: kubepilot}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: demo-secrets, key: mysql-user}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: demo-secrets, key: mysql-password}}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "host.minikube.internal:4317"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
