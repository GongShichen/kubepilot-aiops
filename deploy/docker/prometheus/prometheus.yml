global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: kubepilot-agent
    static_configs:
      - targets: [kubepilot-agent:8080]
  - job_name: drain3
    static_configs:
      - targets: [drain3:9091]
  # make bootstrap generates minikube-targets.yml with API-server proxy targets.
  - job_name: minikube-proxy
    file_sd_configs:
      - files: [/etc/prometheus/generated/minikube-targets.yml]
        refresh_interval: 30s
    scheme: https
    tls_config:
      insecure_skip_verify: true
      cert_file: /etc/prometheus/generated/client.crt
      key_file: /etc/prometheus/generated/client.key
