<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KubePilot-AIOps</title><style>body{font:14px system-ui;margin:0;background:#0b1020;color:#dbeafe}header{padding:18px 28px;background:#111a33;display:flex;justify-content:space-between}main{padding:24px;max-width:1200px;margin:auto}.card{background:#111a33;border:1px solid #26375e;border-radius:12px;padding:16px;margin:12px 0}input,button{padding:8px;border-radius:6px;border:1px solid #405586;background:#0b1020;color:#fff}button{cursor:pointer;background:#2563eb}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #26375e}.muted{color:#93a4c7}</style></head><body><header><strong>KubePilot-AIOps</strong><span>Incident Control Plane</span></header><main><div class="card"><label>API Token <input id="token" type="password"></label> <button onclick="load()">刷新</button></div><div class="card"><h2>Incidents</h2><table><thead><tr><th>ID</th><th>Status</th><th>Severity</th><th>Service</th><th>Summary</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(){const t=document.getElementById('token').value;sessionStorage.token=t;const r=await fetch('/api/v1/incidents',{headers:{Authorization:'Bearer '+t}});const data=await r.json();document.getElementById('rows').innerHTML=Array.isArray(data)?data.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.severity}</td><td>${x.service}</td><td class="muted">${x.summary}</td></tr>`).join(''):`<tr><td colspan=5>${data.error}</td></tr>`}document.getElementById('token').value=sessionStorage.token||'';</script></body></html>
